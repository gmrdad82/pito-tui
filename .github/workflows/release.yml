name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  docs:
    name: docs bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      - id: rustc
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-docs-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-docs-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
      - name: build the docs bundle
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: bin/docs-bundle "$GITHUB_REF_NAME"
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            version="${tag#v}"
            awk -v v="$version" '
              /^## / { if (on) exit; on = ($2 == "v" v || $2 == v) ; next }
              on { print }
            ' CHANGELOG.md > tmp/notes.md
            gh release create "$tag" --verify-tag --title "pito-tui $version" --notes-file tmp/notes.md
          fi
          gh release upload "$tag" "tmp/docs-$tag.tar.gz" --clobber
