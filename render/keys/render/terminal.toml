app = "pito-tui"
bin = "keys_demo"
grid = [96, 28]
frame = "window"
typing = "35ms"

[build]
command = "cargo build --release --locked --example keys_demo"
bin_dir = "{target}/release/examples"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.keys_demo]
kind = "clip"
line = "The keys demo: the footer's hints follow the mode, ? opens the help sheet with the current mode first, / searches it, esc clears the search and closes it"
tape = "render/terminal/demo.tape"
launch = "keys_demo"
settle = "1s"
closure = { crossfade = 0.4 }
status = "IN PROGRESS"
