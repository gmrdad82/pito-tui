app = "pito-tui"
bin = "demo"
grid = [100, 24]
frame = "window"
typing = "90ms"

[build]
command = "cargo build --release --locked --example demo"
bin_dir = "{target}/release/examples"

[theme]
name = "pito-tui demo"
background = "#16161e"
foreground = "#c0caf5"
cursor = "#c0caf5"
selection = "#283457"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
brightBlack = "#414868"
brightRed = "#f7768e"
brightGreen = "#9ece6a"
brightYellow = "#e0af68"
brightBlue = "#7aa2f7"
brightMagenta = "#bb9af7"
brightCyan = "#7dcfff"
brightWhite = "#c0caf5"

[shots.demo]
kind = "clip"
line = "The demo: a job and a real command on the activity band and screen, an accent picked from a list, a find in a 20,000-line log, a read under the hourglass and a drill-in"
tape = "render/terminal/demo.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.activities]
kind = "clip"
line = "A job and a real command on the activity band, the command stopped, then the activity screen over Home with a job opened under its own breadcrumb"
tape = "render/terminal/activities.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.log]
kind = "clip"
line = "A find in a 20,000-line log, stepping through the hits and to both ends, with the scrollbar and the range count"
tape = "render/terminal/log.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.pick]
kind = "clip"
line = "The pick-one prompt choosing an accent, twice"
tape = "render/terminal/pick.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.modal]
kind = "clip"
line = "An app-owned modal: a field narrowing a list with headings the cursor skips, a row that needs a second enter, and an alert"
tape = "render/terminal/modal.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.layers]
kind = "clip"
line = "A band under the header counting down, a takeover with the hourglass, toasts, and a gate before the app"
tape = "render/terminal/layers.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.quit]
kind = "clip"
line = "The quit guard: one ctrl+c arms it until it lapses, and with work running two ask first"
tape = "render/terminal/quit.tape"
launch = "demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.stack]
kind = "clip"
line = "The header as a row stack: groups with an underlined key, a caption, tabs numbered in their group, focus moving through the rows and an after-tabs selector"
tape = "render/terminal/stack.tape"
launch = "demo --stack"
settle = "400ms"
closure = { crossfade = 0.5 }
