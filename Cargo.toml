[package]
name = "pito-tui"
version = "0.3.0"
authors = ["Gamer Dad"]
edition = "2024"
description = "The app shell for PITO terminal apps: one crate that brings the header, footer, hourglass and list, a palette from one accent colour or a whole set, a panic-safe terminal guard, a 120 fps paced loop, key routing with a double ctrl+c quit guard, an activity band and screen, and headless dumps"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-tui"
publish = false

[lib]
name = "pito_tui"

[dependencies]
crossterm = "0.29"
pito-footer = { git = "https://github.com/gmrdad82/pito-footer", tag = "v0.4.0", features = ["crossterm"] }
pito-header = { git = "https://github.com/gmrdad82/pito-header", tag = "v0.2.0", features = ["crossterm"] }
pito-hourglass = { git = "https://github.com/gmrdad82/pito-hourglass", tag = "v0.1.3" }
pito-list = { git = "https://github.com/gmrdad82/pito-list", tag = "v0.7.0", features = ["crossterm"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "std", "layout-cache"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
