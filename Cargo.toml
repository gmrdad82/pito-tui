[package]
name = "pito-tui"
version = "1.4.0"
authors = ["Gamer Dad"]
edition = "2024"
description = "The app shell for PITO MD terminal apps: one crate with its own header, footer, hourglass and list, a palette from one accent colour or a whole set, a panic-safe terminal guard, a 120 fps paced loop, key routing with a double ctrl+c quit guard, an activity band and screen, and headless dumps"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-tui"
publish = false

[lib]
name = "pito_tui"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std", "layout-cache"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }
signal-hook = "0.3.18"

[[example]]
name = "list_demo"
test = true
